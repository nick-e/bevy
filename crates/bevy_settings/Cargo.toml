[package]
name = "bevy-settings"
version = "0.19.1"
edition = "2024"
description = "User settings framework for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[dependencies]
# bevy
# Published requirements rather than sibling paths, so a consumer that patches only this crate
# resolves these to the same published crates the rest of its graph already uses. See the commit
# that introduced this for why a path dependency breaks that consumer.
bevy_app = "0.19.1"
bevy_ecs = "0.19.1"
bevy_ecs_macros = "0.19.1"
bevy_log = "0.19.1"
bevy_platform = "0.19.1"
bevy_reflect = "0.19.1"
bevy_tasks = "0.19.1"
bevy_time = "0.19.1"

serde = "1.0.217"
thiserror = "2.0.18"
toml = { version = "1.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", default-features = false, features = [
  "Window",
  "Storage",
] }

[features]
default = []

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition"]
all-features = true
